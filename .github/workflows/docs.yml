name: Build and Deploy Doxygen Docs

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOXYGEN_VERSION: 1.18.0
  DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: |
          git submodule update --init --depth=1
          git submodule foreach 'git fetch origin && git checkout origin/main || git checkout origin/master'

      - name: Record source revisions
        run: |
          printf 'docs %s\n' "$(git rev-parse HEAD)"
          git submodule foreach --quiet 'printf "%s %s\n" "$name" "$(git rev-parse HEAD)"'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Doxygen
        run: |
          archive="${RUNNER_TEMP}/doxygen-${DOXYGEN_VERSION}.tar.gz"
          install_dir="${RUNNER_TEMP}/doxygen-${DOXYGEN_VERSION}"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            --output "${archive}" \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          printf '%s  %s\n' "${DOXYGEN_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar --extract --gzip --file "${archive}" --strip-components=1 --directory "${install_dir}"
          test -x "${install_dir}/bin/doxygen"
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"
          "${install_dir}/bin/doxygen" --version

      - name: Create output directory
        run: mkdir -p docs/LAMMP docs/LMCAS docs/LMMC

      - name: Build LAMMP docs
        working-directory: LAMMP
        run: |
          ( cat Doxyfile
            echo "OUTPUT_DIRECTORY = ../docs/LAMMP"
            echo "GENERATE_TAGFILE = ../docs/LAMMP/lammp.tag"
            echo "NUM_PROC_THREADS = 1"
            echo "DOT_NUM_THREADS = 1"
            echo "DOT_PATH ="
          ) | doxygen -

      - name: Build LMCAS docs
        working-directory: LMCAS
        run: |
          ( cat Doxyfile
            echo "OUTPUT_DIRECTORY = ../docs/LMCAS"
            echo "GENERATE_TAGFILE = ../docs/LMCAS/lmcas.tag"
            echo "NUM_PROC_THREADS = 1"
            echo "DOT_NUM_THREADS = 1"
          ) | doxygen -

      - name: Build LMMC docs
        working-directory: LMMC
        run: |
          ( cat Doxyfile
            echo "OUTPUT_DIRECTORY = ../docs/LMMC"
            echo "NUM_PROC_THREADS = 1"
            echo "DOT_NUM_THREADS = 1"
          ) | doxygen -

      - name: verify
        run: |
          echo "docs/ contents"
          find docs -maxdepth 2 -type d
          echo "file count"
          find docs -type f | wc -l

      - name: Deploy to dep branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd docs
          git init
          git checkout -b dep
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy docs $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin dep
